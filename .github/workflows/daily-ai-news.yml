name: Daily AI News

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: Select which brief to send
        required: true
        default: concept
        type: choice
        options:
          - concept
          - news
          - both

jobs:
  send-news:
    if: github.event.schedule == '0 1 * * *' || github.event.inputs.delivery_mode == 'news' || github.event.inputs.delivery_mode == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAI key presence
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "OPENAI_API_KEY is present"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Send AI news to Slack
        env:
          DELIVERY_MODE: news
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS || '1' }}
          QUERY_TERMS: ${{ vars.QUERY_TERMS || '生成AI 活用事例,生成AI 導入事例 企業,LLM セキュリティ,生成AI ガバナンス,AI規制,RAG エージェント' }}
        run: npm run send

  send-concept:
    if: github.event.schedule == '0 5 * * *' || github.event.inputs.delivery_mode == 'concept' || github.event.inputs.delivery_mode == 'both'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send concept brief to Slack
        env:
          DELIVERY_MODE: concept
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: npm run send
